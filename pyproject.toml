[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "road-video-miner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3", "Pillow==12.3.0", "requests", "torch==2.14.0", "torchvision==0.29.0", "streamlit", "pytest", "ruff"]
[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
[tool.setuptools]
py-modules = ["miner"]
package-dir = {"" = "src"}
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
